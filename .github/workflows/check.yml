name: Check
on:
  pull_request:
  push:
    branches: [master, 'codex/**']
permissions:
  contents: read
jobs:
  tests:
    name: Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --shard=${{ matrix.shard }}/4 --maxWorkers=1
  check:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/audit-vocabulary-dictionary.mjs --check
      - run: npm run vocabulary:quality -- --check
      - run: npm run test:identities
      - run: node scripts/check-bundle-budget.mjs
